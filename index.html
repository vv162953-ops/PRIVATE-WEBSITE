
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Private Space ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .box {
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      background: rgba(255,255,255,0.15);
      border-radius: 25px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 16px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #ff4f81;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.02);
    }

    #secret {
      display: none;
    }

    .heart {
      font-size: 55px;
      margin-bottom: 15px;
      animation: beat 1s infinite;
    }

    .message {
      line-height: 1.7;
      margin-top: 20px;
    }

    @keyframes beat {
      50% {
        transform: scale(1.15);
      }
    }

    #error {
      color: #fff;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <!-- PASSWORD SCREEN -->
  <div class="box" id="login">
    <div class="heart">❤️</div>

    <h1>Private Space</h1>

    <p>Enter the secret password 🔐</p>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
    >

    <button onclick="unlock()">
      Unlock ❤️
    </button>

    <p id="error">
      Wrong password 😅
    </p>
  </div>


  <!-- PRIVATE CONTENT -->
  <div class="box" id="secret">

    <div class="heart">❤️</div>

    <h1>Welcome to Our Space</h1>

    <p class="message">
      This little place is just for us. 💕
      <br><br>
      Our memories, our messages,
      our special moments... ✨
      <br><br>
      Nobody else gets to enter. 🔐❤️
    </p>

    <br>

    <button onclick="logout()">
      Lock 🔒
    </button>

  </div>


  <script>
    function unlock() {

      const password =
        document.getElementById("password").value;

      // CHANGE YOUR PASSWORD HERE
      const correctPassword = "23120706";

      if (password === correctPassword) {

        document.getElementById("login").style.display = "none";
        document.getElementById("secret").style.display = "block";

      } else {

        document.getElementById("error").style.display = "block";

      }
    }

    function logout() {

      document.getElementById("secret").style.display = "none";
      document.getElementById("login").style.display = "block";

      document.getElementById("password").value = "";
      document.getElementById("error").style.display = "none";

    }
  </script>

</body>
</html>
